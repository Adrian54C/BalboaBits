/* La intro cinematográfica se reproduce una sola vez por sesión de navegación. */
try {
  const sameSiteReferrer = document.referrer
    ? new URL(document.referrer).origin === location.origin
    : location.protocol === 'file:';
  if (sessionStorage.getItem('bbIntroPlayed') === '1' && sameSiteReferrer) {
    document.documentElement.classList.add('bb-intro-seen');
  } else {
    sessionStorage.setItem('bbIntroPlayed', '1');
  }
} catch (_) {}
</script>
